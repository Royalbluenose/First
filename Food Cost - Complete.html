<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5f0">
  <title>Crumb — food cost, made simple</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292b23;
      --muted: #77796f;
      --line: #e7e5dc;
      --paper: #fffefa;
      --canvas: #f6f5f0;
      --green: #526d57;
      --green-dark: #3e5843;
      --green-pale: #edf2eb;
      --orange: #d78a4d;
      --danger: #a34a3d;
      --shadow: 0 14px 38px rgba(50, 48, 38, .06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }
    .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 56px; }
    .topbar, .brand, .top-actions, .section-heading, .ingredient-heading, .meal-heading,
    .row-heading, .summary-line, .form-actions, .meal-footer { display: flex; align-items: center; }
    .topbar { justify-content: space-between; margin-bottom: 21px; }
    .brand { gap: 10px; font-size: 17px; font-weight: 750; letter-spacing: -.04em; }
    .brand-mark {
      display: grid; width: 35px; height: 35px; place-items: center;
      border-radius: 12px; background: var(--green); color: white; font-size: 18px;
    }
    .top-actions { gap: 10px; }
    .currency-select { width: auto; min-height: 36px; padding: 6px 26px 6px 9px; font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-bottom: 21px; }
    .stat {
      padding: 15px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
    }
    .stat-value { display: block; font-size: 23px; font-weight: 750; letter-spacing: -.045em; line-height: 1.2; }
    .stat-label { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .menu-tabs {
      display: flex; gap: 6px; margin-bottom: 15px; padding: 5px;
      border: 1px solid var(--line); border-radius: 12px; background: #eeede6;
    }
    .menu-tab {
      flex: 1; min-height: 41px; padding: 8px 13px; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 13px; font-weight: 700;
    }
    .menu-tab[aria-selected="true"] { background: var(--paper); color: var(--green-dark); box-shadow: 0 2px 6px rgba(50, 48, 38, .08); }
    .menu-tab:hover:not([aria-selected="true"]) { color: var(--ink); }
    .main-grid { display: block; }
    .menu-panel[hidden] { display: none; }
    .planner-card { padding: 20px; }
    .planner-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .week-navigation { display: flex; align-items: center; gap: 9px; }
    .week-label { min-width: 180px; font-size: 13px; font-weight: 700; text-align: center; }
    .week-button { min-width: 36px; min-height: 36px; padding: 5px 10px; }
    .week-total { color: var(--muted); font-size: 12px; text-align: right; }
    .week-total strong { display: block; color: var(--green-dark); font-size: 18px; }
    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .day-card { min-width: 0; padding: 10px 8px; border: 1px solid var(--line); border-radius: 11px; background: #fffefa; }
    .day-card.today { border-color: #9eb99e; background: #f7faf5; }
    .day-heading { min-height: 37px; margin-bottom: 9px; padding-bottom: 7px; border-bottom: 1px solid var(--line); text-align: center; }
    .day-name { display: block; font-size: 11px; font-weight: 750; }
    .day-date { display: block; color: var(--muted); font-size: 10px; }
    .day-slot { margin-top: 9px; }
    .day-slot label { display: block; margin-bottom: 4px; color: #65675e; font-size: 10px; font-weight: 650; }
    .day-slot select { min-height: 35px; padding: 5px 20px 5px 6px; font-size: 11px; }
    .day-slot select:disabled { background: #f3f2ed; color: var(--muted); }
    .day-cost { margin-top: 10px; padding-top: 7px; border-top: 1px solid var(--line); color: var(--green-dark); font-size: 10px; font-weight: 700; text-align: right; }
    .planner-empty { margin-bottom: 12px; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); box-shadow: var(--shadow); }
    .card-inner { padding: 20px; }
    .section-heading { justify-content: space-between; gap: 10px; margin-bottom: 17px; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 500; letter-spacing: -.035em; }
    .form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 92px 100px; gap: 10px; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 5px; color: #65675e; font-size: 11px; font-weight: 650; }
    input, select {
      width: 100%; min-width: 0; min-height: 39px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink);
    }
    input::placeholder { color: #a2a39b; }
    .cost-field { margin-top: 10px; }
    .form-actions { justify-content: flex-end; gap: 8px; margin-top: 13px; }
    .button {
      min-height: 37px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 9px;
      background: white; color: var(--ink); font-size: 12px; font-weight: 650;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .button:hover { border-color: #d4d2c8; background: #faf9f5; }
    .button:active { transform: translateY(1px); }
    .button-primary { border-color: var(--green); background: var(--green); color: white; }
    .button-primary:hover { border-color: var(--green-dark); background: var(--green-dark); }
    .button-small { min-height: 30px; padding: 5px 9px; font-size: 11px; }
    .button-danger { color: var(--danger); }
    .list-divider { height: 1px; margin: 19px 0 0; background: var(--line); }
    .list-heading { display: flex; justify-content: space-between; margin: 14px 0 8px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .ingredient-list, .meal-list { display: grid; gap: 8px; }
    .ingredient-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center;
      padding: 10px 11px; border: 1px solid var(--line); border-radius: 11px;
    }
    .ingredient-name, .meal-name { overflow: hidden; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .ingredient-detail, .meal-detail { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .ingredient-cost { color: var(--green-dark); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .row-actions { display: flex; gap: 5px; margin-top: 7px; }
    .empty-state { padding: 17px 12px; border: 1px dashed #deddd3; border-radius: 11px; color: var(--muted); font-size: 12px; text-align: center; }
    .recipe-card { padding: 20px; }
    .recipe-form { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fbfaf6; }
    .meal-name-field { margin-bottom: 13px; }
    .row-heading { justify-content: space-between; gap: 8px; margin-bottom: 8px; color: #65675e; font-size: 11px; font-weight: 700; }
    .recipe-rows { display: grid; gap: 7px; }
    .recipe-row { display: grid; grid-template-columns: minmax(0, 1fr) 82px 73px 29px; gap: 7px; align-items: center; }
    .recipe-row select, .recipe-row input { min-height: 36px; padding: 6px 8px; font-size: 12px; }
    .remove-row {
      display: grid; width: 29px; height: 29px; place-items: center; border: 0; border-radius: 7px;
      background: transparent; color: #898a82; font-size: 17px;
    }
    .remove-row:hover { background: #f3efeb; color: var(--danger); }
    .recipe-controls { display: grid; grid-template-columns: 1fr 115px; gap: 10px; align-items: end; margin-top: 12px; }
    .recipe-controls .field label { font-size: 10px; }
    .recipe-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
    .recipe-footer-actions { display: flex; align-items: center; gap: 7px; }
    .live-total-label { color: var(--muted); font-size: 11px; }
    .live-total { display: block; color: var(--green-dark); font-size: 18px; font-weight: 750; letter-spacing: -.035em; }
    .meal-list-heading { flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .meal-list-controls { display: flex; flex-wrap: wrap; gap: 7px; }
    .meal-card { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; }
    .meal-heading { justify-content: space-between; gap: 10px; align-items: flex-start; }
    .meal-category { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 20px; background: var(--green-pale); color: var(--green-dark); font-size: 10px; font-weight: 700; }
    .meal-total { color: var(--green-dark); font-size: 17px; font-weight: 750; white-space: nowrap; }
    .meal-breakdown { margin: 10px 0 0; padding: 9px 0 0; border-top: 1px solid #eeece5; color: #62645a; font-size: 11px; }
    .meal-breakdown ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .meal-breakdown li { display: flex; justify-content: space-between; gap: 10px; }
    .meal-footer { justify-content: space-between; gap: 8px; margin-top: 10px; }
    .meal-footer .meal-detail { margin: 0; }
    .notice { margin-bottom: 14px; padding: 10px 12px; border: 1px solid #ead2ae; border-radius: 9px; background: #fff8ec; color: #76521f; font-size: 12px; }
    .notice[hidden] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }

    @media (max-width: 760px) {
      .shell { width: min(620px, calc(100% - 28px)); padding-top: 20px; }
      .topbar { margin-bottom: 20px; }
      .main-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .shell { width: calc(100% - 24px); }
      .stats { gap: 7px; }
      .stat { padding: 12px 10px; }
      .stat-value { font-size: 20px; }
      .stat-label { font-size: 10px; }
      .card-inner, .recipe-card { padding: 15px; }
      .form-grid { grid-template-columns: minmax(0, 1fr) 77px 85px; gap: 7px; }
      .recipe-row { grid-template-columns: minmax(0, 1fr) 67px 62px 26px; gap: 5px; }
      .recipe-row select, .recipe-row input { padding: 5px; font-size: 11px; }
      .recipe-row .remove-row { width: 26px; height: 26px; }
      .recipe-controls { grid-template-columns: 1fr 100px; }
      .meal-footer { align-items: flex-start; }
      .planner-card { padding: 13px; }
      .planner-toolbar { align-items: flex-start; }
      .week-navigation { gap: 5px; }
      .week-label { min-width: 0; font-size: 11px; }
      .week-button { min-width: 32px; min-height: 34px; padding: 4px 8px; }
      .week-total { max-width: 112px; font-size: 10px; }
      .week-total strong { font-size: 16px; }
      .week-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .day-card { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 0 9px; padding: 10px; }
      .day-heading { grid-row: 1 / span 4; align-self: start; margin: 0; padding: 8px 4px 0 0; border-right: 1px solid var(--line); border-bottom: 0; text-align: left; }
      .day-slot { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 6px; margin-top: 5px; }
      .day-slot label { margin: 0; }
      .day-slot select { min-height: 36px; }
      .day-cost { grid-column: 2; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">C</span> Crumb</div>
      <div class="top-actions">
        <label class="sr-only" for="currencySelect">Currency</label>
        <select class="currency-select" id="currencySelect" aria-label="Currency">
          <option value="USD">USD $</option>
          <option value="CAD">CAD $</option>
          <option value="AUD">AUD $</option>
          <option value="EUR">EUR €</option>
          <option value="GBP">GBP £</option>
          <option value="NZD">NZD $</option>
        </select>
      </div>
    </header>

    <div class="notice" id="notice" role="status" hidden></div>

    <section class="stats" aria-label="Kitchen summary">
      <div class="stat"><span class="stat-value" id="ingredientCount">0</span><span class="stat-label">Ingredients in pantry</span></div>
      <div class="stat"><span class="stat-value" id="mealCount">0</span><span class="stat-label">Meals costed</span></div>
      <div class="stat"><span class="stat-value" id="averageCost">—</span><span class="stat-label">Average meal cost</span></div>
    </section>

    <nav class="menu-tabs" role="tablist" aria-label="Kitchen menus">
      <button class="menu-tab" id="pantryTab" type="button" role="tab" aria-selected="false" aria-controls="pantryPanel" tabindex="-1">Your pantry</button>
      <button class="menu-tab" id="mealsTab" type="button" role="tab" aria-selected="true" aria-controls="mealsPanel">Build a meal</button>
      <button class="menu-tab" id="planTab" type="button" role="tab" aria-selected="false" aria-controls="planPanel" tabindex="-1">Meal plan</button>
    </nav>

    <div class="main-grid">
      <section class="card card-inner menu-panel" id="pantryPanel" role="tabpanel" aria-labelledby="pantryTab" hidden>
        <div class="section-heading">
          <div><h2 id="pantryTitle">Your pantry</h2></div>
        </div>
        <form id="ingredientForm">
          <div class="form-grid">
            <div class="field"><label for="ingredientName">Ingredient</label><input id="ingredientName" name="name" maxlength="70" placeholder="e.g. Rolled oats" required></div>
            <div class="field"><label for="packageAmount">Pack size</label><input id="packageAmount" name="amount" type="number" min="0.001" step="any" placeholder="500" required></div>
            <div class="field"><label for="packageUnit">Unit</label><select id="packageUnit" name="unit"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">L</option><option value="each">each</option></select></div>
          </div>
          <div class="field cost-field"><label for="packageCost">What you paid</label><input id="packageCost" name="cost" type="number" min="0" step="0.01" placeholder="4.50" required></div>
          <div class="form-actions">
            <button class="button" id="cancelEditButton" type="button" hidden>Cancel edit</button>
            <button class="button button-primary" id="saveIngredientButton" type="submit">Add ingredient</button>
          </div>
        </form>
        <div class="list-divider"></div>
        <div class="list-heading"><span>Pantry list</span><span id="pantryCount">0 items</span></div>
        <div class="ingredient-list" id="ingredientList"></div>
      </section>

      <section class="card recipe-card menu-panel" id="mealsPanel" role="tabpanel" aria-labelledby="mealsTab">
        <div class="section-heading">
          <div><h2 id="recipeTitle">Build a meal</h2></div>
        </div>
        <form class="recipe-form" id="mealForm">
          <div class="field meal-name-field">
            <label for="mealName">Meal name</label>
            <input id="mealName" name="name" maxlength="80" placeholder="e.g. Sunday granola" required>
          </div>
          <div class="field meal-name-field">
            <label for="mealCategory">Meal type</label>
            <select id="mealCategory" required>
              <option value="">Choose a meal type</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Snack">Snack</option>
              <option value="Uncategorised">Uncategorised</option>
            </select>
          </div>
          <div class="row-heading"><span>Ingredients &amp; amounts</span><button class="button button-small" id="addRowButton" type="button">+ Add ingredient</button></div>
          <div class="recipe-rows" id="recipeRows"></div>
          <div class="recipe-controls">
            <div class="field">
              <label for="servings">Servings this recipe makes</label>
              <input id="servings" type="number" min="1" step="1" value="1" required>
            </div>
            <div aria-live="polite">
              <span class="live-total-label">Recipe total</span>
              <strong class="live-total" id="liveTotal">$0.00</strong>
            </div>
          </div>
          <div class="recipe-footer">
            <span class="live-total-label" id="perServing">Cost per serving: $0.00</span>
            <div class="recipe-footer-actions">
              <button class="button" id="cancelMealEditButton" type="button" hidden>Cancel</button>
              <button class="button button-primary" id="saveMealButton" type="submit">Save meal</button>
            </div>
          </div>
        </form>
        <div class="list-heading meal-list-heading">
          <span>Your meals</span>
          <div class="meal-list-controls">
            <label class="sr-only" for="mealFilter">Filter meals by type</label>
            <select class="currency-select" id="mealFilter" aria-label="Filter meals by type">
              <option value="All">All meals</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Snack">Snack</option>
              <option value="Uncategorised">Uncategorised</option>
            </select>
            <label class="sr-only" for="mealSort">Sort meals</label>
            <select class="currency-select" id="mealSort" aria-label="Sort meals">
              <option value="recent">Recently added</option>
              <option value="name">Name A–Z</option>
              <option value="cost-asc">Cost: low to high</option>
              <option value="cost-desc">Cost: high to low</option>
            </select>
          </div>
          <span id="mealsCount">0 saved</span>
        </div>
        <div class="meal-list" id="mealList"></div>
      </section>

      <section class="card planner-card menu-panel" id="planPanel" role="tabpanel" aria-labelledby="planTab" hidden>
        <div class="planner-toolbar">
          <div class="week-navigation" aria-label="Choose week">
            <button class="button week-button" id="previousWeekButton" type="button" aria-label="Previous week">←</button>
            <strong class="week-label" id="weekLabel"></strong>
            <button class="button week-button" id="nextWeekButton" type="button" aria-label="Next week">→</button>
          </div>
          <div class="week-total" id="weekTotal" aria-live="polite"></div>
        </div>
        <div class="empty-state planner-empty" id="plannerEmpty" hidden></div>
        <div class="week-grid" id="weekGrid" aria-label="Weekly meal timetable"></div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "crumb-food-cost-v1";
      const units = {
        g: { dimension: "weight", factor: 1, label: "g" },
        kg: { dimension: "weight", factor: 1000, label: "kg" },
        ml: { dimension: "volume", factor: 1, label: "ml" },
        l: { dimension: "volume", factor: 1000, label: "L" },
        each: { dimension: "count", factor: 1, label: "each" }
      };
      const planSlots = ["Breakfast", "Lunch", "Dinner", "Snack"];
      const defaultState = { ingredients: [], meals: [], plan: {}, currency: "GBP", seeded: true };
      const starterData = {
        currency: "GBP",
        seeded: true,
        ingredients: [
          { id: "starter-wholewheat-pasta", name: "Wholewheat Pasta", amount: 1, unit: "kg", cost: 0.75 },
          { id: "starter-yellow-pepper", name: "Pepper (Yellow)", amount: 1, unit: "each", cost: 0.8 },
          { id: "starter-tomato", name: "Tomato", amount: 1, unit: "each", cost: 0.8 },
          { id: "starter-paneer", name: "Paneer", amount: 1, unit: "each", cost: 2.2 },
          { id: "starter-lime", name: "Lime", amount: 1, unit: "each", cost: 0.3 },
          { id: "starter-olive-oil", name: "Olive Oil", amount: 750, unit: "ml", cost: 6.75 },
          { id: "starter-tideford-soup", name: "Tideford Soup", amount: 560, unit: "g", cost: 3.5 },
          { id: "starter-wholemeal-bread", name: "Wholemeal Bread (Fresh)", amount: 400, unit: "g", cost: 1.3 },
          { id: "starter-wholewheat-bread", name: "Wholewheat Bread", amount: 800, unit: "g", cost: 1.75 },
          { id: "starter-peanut-butter", name: "Peanut Butter", amount: 1, unit: "kg", cost: 6 },
          { id: "starter-jam", name: "Jam", amount: 340, unit: "g", cost: 2.55 }
        ],
        meals: [
          {
            id: "starter-pb-jam-toast",
            name: "PB & Jam on Toast x2",
            category: "Snack",
            servings: 1,
            items: [
              { ingredientId: "starter-wholewheat-bread", amount: 40, unit: "g" },
              { ingredientId: "starter-peanut-butter", amount: 32, unit: "g" },
              { ingredientId: "starter-jam", amount: 10, unit: "g" }
            ]
          },
          {
            id: "starter-tideford-soup-meal",
            name: "Tideford Soup Meal",
            category: "Dinner",
            servings: 1,
            items: [
              { ingredientId: "starter-tideford-soup", amount: 280, unit: "g" },
              { ingredientId: "starter-wholemeal-bread", amount: 200, unit: "g" }
            ]
          },
          {
            id: "starter-pasta-salad",
            name: "Pasta Salad",
            category: "Lunch",
            servings: 1,
            items: [
              { ingredientId: "starter-wholewheat-pasta", amount: 120, unit: "g" },
              { ingredientId: "starter-yellow-pepper", amount: 0.25, unit: "each" },
              { ingredientId: "starter-tomato", amount: 0.5, unit: "each" },
              { ingredientId: "starter-paneer", amount: 0.5, unit: "each" },
              { ingredientId: "starter-lime", amount: 1, unit: "each" },
              { ingredientId: "starter-olive-oil", amount: 15, unit: "ml" }
            ]
          }
        ],
        plan: {}
      };
      const elements = Object.fromEntries([
        "notice", "ingredientCount", "mealCount", "averageCost", "ingredientForm",
        "ingredientName", "packageAmount", "packageUnit", "packageCost", "cancelEditButton",
        "saveIngredientButton", "pantryCount", "ingredientList", "mealForm", "mealName",
        "addRowButton", "recipeRows", "servings", "liveTotal", "perServing", "mealsCount",
        "mealList", "currencySelect", "saveMealButton", "cancelMealEditButton",
        "mealCategory", "mealFilter", "mealSort", "pantryTab", "mealsTab",
        "pantryPanel", "mealsPanel", "planTab", "planPanel", "weekLabel",
        "weekTotal", "weekGrid", "plannerEmpty", "previousWeekButton", "nextWeekButton"
      ].map(id => [id, document.getElementById(id)]));

      let state = loadState();
      let editingIngredientId = null;
      let editingMealId = null;
      let noticeTimer;
      let currentWeekStart = getMonday(new Date());

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return JSON.parse(JSON.stringify(starterData));
          const parsed = JSON.parse(saved);
          if (!parsed || !Array.isArray(parsed.ingredients) || !Array.isArray(parsed.meals)) {
            throw new Error("Saved kitchen data has an unexpected format.");
          }
          const ingredients = parsed.ingredients.filter(item =>
            item && typeof item.id === "string" && typeof item.name === "string" &&
            Number.isFinite(item.amount) && item.amount > 0 && units[item.unit] &&
            Number.isFinite(item.cost) && item.cost >= 0
          );
          const ingredientIds = new Set(ingredients.map(item => item.id));
          const meals = parsed.meals.filter(meal =>
            meal && typeof meal.id === "string" && typeof meal.name === "string" &&
            Number.isInteger(meal.servings) && meal.servings > 0 &&
            Array.isArray(meal.items) && meal.items.length > 0 &&
            meal.items.every(item => ingredientIds.has(item.ingredientId) &&
              Number.isFinite(item.amount) && item.amount > 0 && units[item.unit] &&
              units[item.unit].dimension === units[ingredients.find(ingredient => ingredient.id === item.ingredientId).unit].dimension)
          ).map(meal => ({
            ...meal,
            category: ["Breakfast", "Lunch", "Dinner", "Snack", "Uncategorised"].includes(meal.category)
              ? meal.category
              : "Uncategorised"
          }));
          const mealIds = new Set(meals.map(meal => meal.id));
          const plan = {};
          if (parsed.plan && typeof parsed.plan === "object" && !Array.isArray(parsed.plan)) {
            for (const [date, assignments] of Object.entries(parsed.plan)) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !assignments || typeof assignments !== "object" || Array.isArray(assignments)) continue;
              const validAssignments = {};
              for (const slot of planSlots) {
                if (typeof assignments[slot] === "string" && mealIds.has(assignments[slot])) {
                  validAssignments[slot] = assignments[slot];
                }
              }
              if (Object.keys(validAssignments).length) plan[date] = validAssignments;
            }
          }
          const currency = ["USD", "CAD", "AUD", "EUR", "GBP", "NZD"].includes(parsed.currency)
            ? parsed.currency
            : "GBP";
          if (parsed.seeded !== true && ingredients.length === 0 && meals.length === 0) {
            return { ...JSON.parse(JSON.stringify(starterData)), currency };
          }
          return {
            ingredients,
            meals,
            plan,
            currency,
            seeded: true
          };
        } catch (error) {
          showNotice(`Could not load saved kitchen data: ${error.message}`);
          return { ...defaultState, ingredients: [], meals: [] };
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          showNotice(`Could not save your changes on this device: ${error.message}`);
          return false;
        }
      }

      function showNotice(message) {
        elements.notice.textContent = message;
        elements.notice.hidden = false;
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => { elements.notice.hidden = true; }, 6500);
      }

      function formatMoney(value) {
        return new Intl.NumberFormat(undefined, {
          style: "currency", currency: state.currency, minimumFractionDigits: 2, maximumFractionDigits: 2
        }).format(Number.isFinite(value) ? value : 0);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      function unitCost(ingredient) {
        return ingredient.cost / (ingredient.amount * units[ingredient.unit].factor);
      }

      function itemCost(item) {
        const ingredient = state.ingredients.find(entry => entry.id === item.ingredientId);
        if (!ingredient) return 0;
        return item.amount * units[item.unit].factor * unitCost(ingredient);
      }

      function mealCost(meal) {
        return meal.items.reduce((total, item) => total + itemCost(item), 0);
      }

      function plannedServingCost(meal) {
        return Math.round(mealCost(meal) / meal.servings * 100) / 100;
      }

      function getMonday(date) {
        const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
        return monday;
      }

      function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function formatDate(date, options) {
        return new Intl.DateTimeFormat(undefined, options).format(date);
      }

      function renderPlan() {
        const dates = Array.from({ length: 7 }, (_, index) => {
          const date = new Date(currentWeekStart);
          date.setDate(date.getDate() + index);
          return date;
        });
        const firstDate = dates[0];
        const lastDate = dates[6];
        const sameMonth = firstDate.getMonth() === lastDate.getMonth() &&
          firstDate.getFullYear() === lastDate.getFullYear();
        elements.weekLabel.textContent = sameMonth
          ? `${formatDate(firstDate, { month: "short" })} ${firstDate.getDate()}–${lastDate.getDate()}, ${lastDate.getFullYear()}`
          : `${formatDate(firstDate, { month: "short", day: "numeric" })} – ${formatDate(lastDate, { month: "short", day: "numeric", year: "numeric" })}`;

        const sortedMeals = [...state.meals].sort((first, second) =>
          first.name.localeCompare(second.name, undefined, { sensitivity: "base" })
        );
        elements.plannerEmpty.hidden = sortedMeals.length > 0;
        elements.plannerEmpty.textContent = sortedMeals.length
          ? ""
          : "Save a meal in Build a meal first, and it will be available to add to your week.";
        elements.weekGrid.innerHTML = dates.map(date => {
          const key = dateKey(date);
          const assignments = state.plan[key] || {};
          let dayTotal = 0;
          let assignedCount = 0;
          const slots = planSlots.map(slot => {
            const selectedMeal = state.meals.find(meal => meal.id === assignments[slot]);
            if (selectedMeal) {
              dayTotal += plannedServingCost(selectedMeal);
              assignedCount++;
            }
            const options = sortedMeals.map(meal =>
              `<option value="${escapeHtml(meal.id)}"${meal.id === assignments[slot] ? " selected" : ""}>${escapeHtml(meal.name)}</option>`
            ).join("");
            return `<div class="day-slot">
              <label for="plan-${key}-${slot.toLowerCase()}">${slot}</label>
              <select id="plan-${key}-${slot.toLowerCase()}" data-plan-date="${key}" data-plan-slot="${slot}" aria-label="${slot} for ${formatDate(date, { weekday: "long", month: "long", day: "numeric" })}"${sortedMeals.length ? "" : " disabled"}>
                <option value="">No meal planned</option>${options}
              </select>
            </div>`;
          }).join("");
          const todayClass = key === dateKey(new Date()) ? " today" : "";
          return `<article class="day-card${todayClass}">
            <div class="day-heading"><span class="day-name">${formatDate(date, { weekday: "short" })}</span><span class="day-date">${formatDate(date, { month: "short", day: "numeric" })}</span></div>
            ${slots}
            <div class="day-cost">${assignedCount ? `${assignedCount} planned · ${formatMoney(dayTotal)}` : "No meals planned"}</div>
          </article>`;
        }).join("");

        const plannedMeals = dates.flatMap(date => {
          const assignments = state.plan[dateKey(date)] || {};
          return planSlots.map(slot => state.meals.find(meal => meal.id === assignments[slot])).filter(Boolean);
        });
        const total = plannedMeals.reduce((sum, meal) => sum + plannedServingCost(meal), 0);
        elements.weekTotal.innerHTML = `<span>${plannedMeals.length} ${plannedMeals.length === 1 ? "meal" : "meals"} planned</span><strong>${formatMoney(total)}</strong><span>estimated cost · per serving</span>`;
      }

      function render() {
        renderIngredients();
        refreshRecipeRows();
        renderMeals();
        renderStats();
        renderPlan();
        elements.currencySelect.value = state.currency;
        updateLiveTotal();
      }

      function renderIngredients() {
        elements.ingredientCount.textContent = String(state.ingredients.length);
        elements.pantryCount.textContent = `${state.ingredients.length} ${state.ingredients.length === 1 ? "item" : "items"}`;
        if (!state.ingredients.length) {
          elements.ingredientList.innerHTML = '<div class="empty-state">Your pantry is waiting for its first ingredient.</div>';
          return;
        }
        const sortedIngredients = [...state.ingredients].sort((first, second) =>
          first.name.localeCompare(second.name, undefined, { sensitivity: "base" })
        );
        elements.ingredientList.innerHTML = sortedIngredients.map(ingredient => `
          <article class="ingredient-row">
            <div>
              <div class="ingredient-name">${escapeHtml(ingredient.name)}</div>
              <div class="ingredient-detail">${ingredient.amount} ${units[ingredient.unit].label} pack · ${formatMoney(ingredient.cost)}</div>
              <div class="row-actions">
                <button class="button button-small" type="button" data-edit-ingredient="${escapeHtml(ingredient.id)}">Edit</button>
                <button class="button button-small button-danger" type="button" data-delete-ingredient="${escapeHtml(ingredient.id)}">Remove</button>
              </div>
            </div>
            <span class="ingredient-cost">${formatMoney(unitCost(ingredient) * units[ingredient.unit].factor)} / ${units[ingredient.unit].label}</span>
          </article>`).join("");
      }

      function renderMeals() {
        elements.mealCount.textContent = String(state.meals.length);
        const meals = elements.mealFilter.value === "All"
          ? state.meals
          : state.meals.filter(meal => meal.category === elements.mealFilter.value);
        const sortedMeals = [...meals];
        if (elements.mealSort.value === "name") {
          sortedMeals.sort((first, second) => first.name.localeCompare(second.name, undefined, { sensitivity: "base" }));
        } else if (elements.mealSort.value === "cost-asc") {
          sortedMeals.sort((first, second) => mealCost(first) - mealCost(second) ||
            first.name.localeCompare(second.name, undefined, { sensitivity: "base" }));
        } else if (elements.mealSort.value === "cost-desc") {
          sortedMeals.sort((first, second) => mealCost(second) - mealCost(first) ||
            first.name.localeCompare(second.name, undefined, { sensitivity: "base" }));
        }
        elements.mealsCount.textContent = elements.mealFilter.value === "All"
          ? `${meals.length} saved`
          : `${meals.length} of ${state.meals.length} saved`;
        if (!state.meals.length) {
          elements.mealList.innerHTML = '<div class="empty-state">Meals you cost out will show up here.</div>';
          return;
        }
        if (!meals.length) {
          elements.mealList.innerHTML = `<div class="empty-state">No ${escapeHtml(elements.mealFilter.value.toLowerCase())} meals yet.</div>`;
          return;
        }
        elements.mealList.innerHTML = sortedMeals.map(meal => {
          const total = mealCost(meal);
          const ingredients = meal.items.map(item => {
            const ingredient = state.ingredients.find(entry => entry.id === item.ingredientId);
            return `<li><span>${escapeHtml(ingredient.name)} · ${item.amount} ${units[item.unit].label}</span><strong>${formatMoney(itemCost(item))}</strong></li>`;
          }).join("");
          return `<article class="meal-card">
            <div class="meal-heading">
              <div><div class="meal-name">${escapeHtml(meal.name)}</div><div class="meal-detail">${meal.items.length} ${meal.items.length === 1 ? "ingredient" : "ingredients"}</div><span class="meal-category">${escapeHtml(meal.category)}</span></div>
              <strong class="meal-total">${formatMoney(total)}</strong>
            </div>
            <div class="meal-breakdown"><ul>${ingredients}</ul></div>
            <div class="meal-footer">
              <span class="meal-detail">${formatMoney(total / meal.servings)} per serving · ${meal.servings} ${meal.servings === 1 ? "serving" : "servings"}</span>
              <button class="button button-small" type="button" data-edit-meal="${escapeHtml(meal.id)}">Edit</button>
              <button class="button button-small button-danger" type="button" data-delete-meal="${escapeHtml(meal.id)}">Remove meal</button>
            </div>
          </article>`;
        }).join("");
      }

      function renderStats() {
        const average = state.meals.length
          ? state.meals.reduce((total, meal) => total + mealCost(meal) / meal.servings, 0) / state.meals.length
          : null;
        elements.averageCost.textContent = average === null ? "—" : formatMoney(average);
      }

      function unitsForIngredient(ingredient) {
        return Object.keys(units).filter(unit => units[unit].dimension === units[ingredient.unit].dimension);
      }

      function refreshRecipeRows() {
        const drafts = Array.from(elements.recipeRows.querySelectorAll(".recipe-row"), row => ({
          ingredientId: row.querySelector(".recipe-ingredient").value,
          amount: row.querySelector(".recipe-amount").value,
          unit: row.querySelector(".recipe-unit").value
        }));
        elements.recipeRows.innerHTML = "";
        for (const draft of drafts) {
          if (state.ingredients.some(ingredient => ingredient.id === draft.ingredientId)) {
            addRecipeRow(draft.ingredientId, draft.amount, draft.unit);
          } else {
            addRecipeRow();
          }
        }
      }

      function addRecipeRow(selectedId = "", amountValue = "", selectedUnit = "") {
        const row = document.createElement("div");
        row.className = "recipe-row";
        const options = state.ingredients.map(ingredient =>
          `<option value="${escapeHtml(ingredient.id)}"${ingredient.id === selectedId ? " selected" : ""}>${escapeHtml(ingredient.name)}</option>`
        ).join("");
        row.innerHTML = `
          <select class="recipe-ingredient" aria-label="Ingredient" required><option value="">Choose ingredient</option>${options}</select>
          <input class="recipe-amount" aria-label="Amount" type="number" min="0.001" step="any" placeholder="Amount" value="${escapeHtml(amountValue)}" required>
          <select class="recipe-unit" aria-label="Unit" required></select>
          <button class="remove-row" type="button" aria-label="Remove ingredient row" title="Remove row">×</button>`;
        elements.recipeRows.append(row);
        const ingredientSelect = row.querySelector(".recipe-ingredient");
        const unitSelect = row.querySelector(".recipe-unit");
        const amountInput = row.querySelector(".recipe-amount");

        function updateUnits() {
          const ingredient = state.ingredients.find(entry => entry.id === ingredientSelect.value);
          const validUnits = ingredient ? unitsForIngredient(ingredient) : [];
          unitSelect.innerHTML = validUnits.map(unit =>
            `<option value="${unit}">${units[unit].label}</option>`
          ).join("");
          if (selectedUnit && validUnits.includes(selectedUnit)) {
            unitSelect.value = selectedUnit;
          } else if (ingredient) {
            unitSelect.value = { weight: "g", volume: "ml", count: "each" }[units[ingredient.unit].dimension];
          }
          unitSelect.disabled = !ingredient;
          amountInput.disabled = !ingredient;
          updateLiveTotal();
        }

        ingredientSelect.addEventListener("change", () => {
          selectedUnit = "";
          updateUnits();
        });
        unitSelect.addEventListener("change", updateLiveTotal);
        amountInput.addEventListener("input", updateLiveTotal);
        row.querySelector(".remove-row").addEventListener("click", () => {
          row.remove();
          updateLiveTotal();
        });
        updateUnits();
      }

      function updateLiveTotal() {
        let total = 0;
        for (const row of elements.recipeRows.querySelectorAll(".recipe-row")) {
          const ingredient = state.ingredients.find(entry => entry.id === row.querySelector(".recipe-ingredient").value);
          const amount = Number(row.querySelector(".recipe-amount").value);
          const unit = row.querySelector(".recipe-unit").value;
          if (ingredient && amount > 0 && units[unit] &&
              units[unit].dimension === units[ingredient.unit].dimension) {
            total += amount * units[unit].factor * unitCost(ingredient);
          }
        }
        const servings = Math.max(1, Number(elements.servings.value) || 1);
        elements.liveTotal.textContent = formatMoney(total);
        elements.perServing.textContent = `Cost per serving: ${formatMoney(total / servings)}`;
      }

      function resetIngredientForm() {
        editingIngredientId = null;
        elements.ingredientForm.reset();
        elements.packageUnit.value = "g";
        elements.cancelEditButton.hidden = true;
        elements.saveIngredientButton.textContent = "Add ingredient";
      }

      function resetMealForm() {
        editingMealId = null;
        elements.mealForm.reset();
        elements.mealCategory.value = "";
        elements.recipeRows.innerHTML = "";
        elements.servings.value = "1";
        elements.cancelMealEditButton.hidden = true;
        elements.saveMealButton.textContent = "Save meal";
        if (state.ingredients.length) addRecipeRow();
        else updateLiveTotal();
      }

      elements.ingredientForm.addEventListener("submit", event => {
        event.preventDefault();
        const name = elements.ingredientName.value.trim();
        const amount = Number(elements.packageAmount.value);
        const cost = Number(elements.packageCost.value);
        const unit = elements.packageUnit.value;
        if (!name || !Number.isFinite(amount) || amount <= 0 || !Number.isFinite(cost) || cost < 0 || !units[unit]) {
          showNotice("Enter an ingredient, a pack size greater than zero, and a valid cost.");
          return;
        }
        const existing = state.ingredients.find(item => item.id === editingIngredientId);
        const changesDimension = existing && units[existing.unit].dimension !== units[unit].dimension;
        const ingredientIsUsed = editingIngredientId && state.meals.some(meal =>
          meal.items.some(item => item.ingredientId === editingIngredientId)
        );
        if (changesDimension && ingredientIsUsed) {
          showNotice("This ingredient is used in saved meals. Its measurement type cannot change; remove those meals first.");
          return;
        }
        const ingredient = { id: editingIngredientId || crypto.randomUUID(), name, amount, unit, cost };
        if (existing) {
          state.ingredients = state.ingredients.map(item => item.id === editingIngredientId ? ingredient : item);
        } else {
          state.ingredients.push(ingredient);
        }
        persist();
        resetIngredientForm();
        render();
      });

      elements.cancelEditButton.addEventListener("click", resetIngredientForm);
      elements.ingredientList.addEventListener("click", event => {
        const editButton = event.target.closest("[data-edit-ingredient]");
        const deleteButton = event.target.closest("[data-delete-ingredient]");
        if (editButton) {
          const ingredient = state.ingredients.find(item => item.id === editButton.dataset.editIngredient);
          if (!ingredient) return;
          editingIngredientId = ingredient.id;
          elements.ingredientName.value = ingredient.name;
          elements.packageAmount.value = ingredient.amount;
          elements.packageUnit.value = ingredient.unit;
          elements.packageCost.value = ingredient.cost;
          elements.cancelEditButton.hidden = false;
          elements.saveIngredientButton.textContent = "Save changes";
          elements.ingredientName.focus();
        }
        if (deleteButton) {
          const id = deleteButton.dataset.deleteIngredient;
          const isUsed = state.meals.some(meal => meal.items.some(item => item.ingredientId === id));
          if (isUsed) {
            showNotice("This ingredient is used in a saved meal. Remove those meals first, or edit the ingredient instead.");
            return;
          }
          state.ingredients = state.ingredients.filter(item => item.id !== id);
          persist();
          render();
        }
      });

      elements.addRowButton.addEventListener("click", () => {
        if (!state.ingredients.length) {
          showNotice("Add an ingredient to your pantry before building a meal.");
          return;
        }
        addRecipeRow();
      });
      elements.cancelMealEditButton.addEventListener("click", resetMealForm);
      elements.servings.addEventListener("input", updateLiveTotal);
      elements.mealForm.addEventListener("submit", event => {
        event.preventDefault();
        const name = elements.mealName.value.trim();
        const category = elements.mealCategory.value;
        const servings = Number(elements.servings.value);
        const items = Array.from(elements.recipeRows.querySelectorAll(".recipe-row")).map(row => ({
          ingredientId: row.querySelector(".recipe-ingredient").value,
          amount: Number(row.querySelector(".recipe-amount").value),
          unit: row.querySelector(".recipe-unit").value
        }));
        if (!name || !["Breakfast", "Lunch", "Dinner", "Snack", "Uncategorised"].includes(category) ||
            !Number.isInteger(servings) || servings <= 0 || !items.length ||
            items.some(item => {
              const ingredient = state.ingredients.find(entry => entry.id === item.ingredientId);
              return !ingredient || !Number.isFinite(item.amount) || item.amount <= 0 ||
                !units[item.unit] || units[item.unit].dimension !== units[ingredient.unit].dimension;
            })) {
          showNotice("Give the meal a name and type, add at least one valid ingredient amount, and enter a whole number of servings.");
          return;
        }
        const meal = { id: editingMealId || crypto.randomUUID(), name, category, servings, items };
        if (editingMealId) {
          state.meals = state.meals.map(savedMeal => savedMeal.id === editingMealId ? meal : savedMeal);
        } else {
          state.meals.unshift(meal);
        }
        persist();
        resetMealForm();
        render();
      });
      elements.mealList.addEventListener("click", event => {
        const editButton = event.target.closest("[data-edit-meal]");
        const deleteButton = event.target.closest("[data-delete-meal]");
        if (editButton) {
          const meal = state.meals.find(savedMeal => savedMeal.id === editButton.dataset.editMeal);
          if (!meal) return;
          editingMealId = meal.id;
          elements.mealName.value = meal.name;
          elements.mealCategory.value = meal.category;
          elements.servings.value = String(meal.servings);
          elements.recipeRows.innerHTML = "";
          for (const item of meal.items) {
            addRecipeRow(item.ingredientId, String(item.amount), item.unit);
          }
          elements.cancelMealEditButton.hidden = false;
          elements.saveMealButton.textContent = "Save changes";
          updateLiveTotal();
          elements.mealName.focus();
          elements.mealForm.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        if (deleteButton) {
          const id = deleteButton.dataset.deleteMeal;
          if (editingMealId === id) resetMealForm();
          state.meals = state.meals.filter(meal => meal.id !== id);
          for (const [date, assignments] of Object.entries(state.plan)) {
            for (const slot of planSlots) {
              if (assignments[slot] === id) delete assignments[slot];
            }
            if (!Object.keys(assignments).length) delete state.plan[date];
          }
          persist();
          render();
        }
      });
      elements.currencySelect.addEventListener("change", () => {
        state.currency = elements.currencySelect.value;
        persist();
        render();
      });
      elements.mealFilter.addEventListener("change", renderMeals);
      elements.mealSort.addEventListener("change", renderMeals);
      elements.weekGrid.addEventListener("change", event => {
        const select = event.target.closest("[data-plan-date][data-plan-slot]");
        if (!select) return;
        const { planDate, planSlot } = select.dataset;
        if (!planSlots.includes(planSlot)) return;
        if (!state.plan[planDate]) state.plan[planDate] = {};
        if (select.value && state.meals.some(meal => meal.id === select.value)) {
          state.plan[planDate][planSlot] = select.value;
        } else {
          delete state.plan[planDate][planSlot];
          if (!Object.keys(state.plan[planDate]).length) delete state.plan[planDate];
        }
        persist();
        renderPlan();
      });
      elements.previousWeekButton.addEventListener("click", () => {
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        renderPlan();
      });
      elements.nextWeekButton.addEventListener("click", () => {
        currentWeekStart.setDate(currentWeekStart.getDate() + 7);
        renderPlan();
      });
      const menuTabs = [elements.pantryTab, elements.mealsTab, elements.planTab];
      function selectMenuTab(selectedTab, shouldScroll = true) {
        for (const tab of menuTabs) {
          const isSelected = tab === selectedTab;
          tab.setAttribute("aria-selected", String(isSelected));
          tab.tabIndex = isSelected ? 0 : -1;
          elements[tab.getAttribute("aria-controls")].hidden = !isSelected;
        }
        if (shouldScroll) window.scrollTo({ top: 0, behavior: "smooth" });
      }
      for (const [index, tab] of menuTabs.entries()) {
        tab.addEventListener("click", () => selectMenuTab(tab));
        tab.addEventListener("keydown", event => {
          let nextIndex;
          if (event.key === "ArrowRight") nextIndex = (index + 1) % menuTabs.length;
          else if (event.key === "ArrowLeft") nextIndex = (index + menuTabs.length - 1) % menuTabs.length;
          else if (event.key === "Home") nextIndex = 0;
          else if (event.key === "End") nextIndex = menuTabs.length - 1;
          if (nextIndex !== undefined) {
            event.preventDefault();
            const nextTab = menuTabs[nextIndex];
            selectMenuTab(nextTab, false);
            nextTab.focus();
          }
        });
      }

      state.currency = "GBP";
      persist();
      render();
      if (state.ingredients.length) addRecipeRow();
      else updateLiveTotal();
    })();
  </script>
</body>
</html>
